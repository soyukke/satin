name: Bug report
description: Report a reproducible Satin defect
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, private paths, and terminal history before posting.
        Report security-sensitive findings through the private link below.
  - type: input
    id: satin-version
    attributes:
      label: Satin version
      description: Use the release tag or commit SHA.
      placeholder: v0.2.7
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: macOS 15.6
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest reliable sequence and relevant tmux or Neovim state.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Add logs, screenshots, or recordings only after removing private data.
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and tested the latest available version.
          required: true
        - label: This report contains no credentials or private terminal content.
          required: true
