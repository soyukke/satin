name: Feature request
description: Propose a focused improvement to Satin
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the smallest useful behavior and how a user would discover it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include an existing terminal, tmux, or Neovim workflow when relevant.
  - type: textarea
    id: risks
    attributes:
      label: Compatibility and performance risks
      description: Note renderer, terminal protocol, session, accessibility, or maintenance impact.
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and documentation for this behavior.
          required: true
