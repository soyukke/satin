name: macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag and architecture
        run: |
          version="$(
            sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml |
              head -n 1
          )"
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(uname -m)" = "arm64"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Verify source
        run: nix develop --command just verify

      - name: Build signed arm64 artifacts once
        env:
          UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          test -n "$UPDATE_SIGNING_PRIVATE_KEY_B64"
          nix develop --command just native-ci-build
          jq -e '
            .schemaVersion == 2
              and .signature.algorithm == "ed25519"
              and (.signature.value | length > 0)
          ' spikes/macos-shell/.build/release/latest.json
          nix develop --command just native-update-release-smoke

      - name: Smoke-test application surfaces
        run: nix develop --command just native-ci-smoke

      - name: Attest release provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            spikes/macos-shell/.build/release/Satin-*-macOS-arm64.zip
            spikes/macos-shell/.build/release/latest.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "Satin $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Apple Silicon only. The archive is signed for in-app updates but is not Apple-notarized; macOS may require approval in Privacy & Security on first launch." \
            spikes/macos-shell/.build/release/Satin-*-macOS-arm64.zip \
            spikes/macos-shell/.build/release/latest.json
