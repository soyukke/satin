name: maintainer pull request policy

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no PR code is checked out or run
    branches:
      - main
    types:
      - opened
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  enforce:
    if: >-
      github.repository == 'soyukke/satin' &&
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'COLLABORATOR' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Close external pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pull = context.payload.pull_request;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pull.number,
              body: [
                "Satin currently accepts pull requests only from repository maintainers.",
                "Please open an issue if you want to propose a change.",
              ].join("\n\n"),
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
              state: "closed",
            });
