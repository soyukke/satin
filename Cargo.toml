[package]
name = "satin"
version = "0.2.4"
edition = "2024"
description = "A native macOS terminal with tabs and animated rendering"
license = "MIT"
repository = "https://github.com/soyukke/satin"
readme = "README.md"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
anyhow = "1.0.98"
libghostty-vt = { version = "0.2.0", features = ["png"] }
libc = "0.2.177"
log = "0.4.29"
portable-pty = "0.9.0"
png = "0.18.1"
pulldown-cmark = { version = "0.13.4", default-features = false }
rmpv = "1.3.0"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.145"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
unicode-width = "0.2.1"

[target.'cfg(target_os = "macos")'.dependencies]
lru = "=0.18.2"
skia-safe = { version = "0.99.0", features = ["metal", "textlayout"] }
swash = { version = "=0.2.10", default-features = false, features = ["std"] }

[lints.rust]
rust_2018_idioms = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
too_many_lines = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
